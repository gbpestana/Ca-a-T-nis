# Configurações gerais do monitor.
# A lista de tênis fica em alvos.yaml (edite lá ou use o workflow "Gerenciar lista").

tamanho: "41"

# Inclui modelos femininos na busca? (a numeração BR é a mesma, mas a forma muda)
incluir_feminino: false

alerta:
  # PROMOÇÃO ÓTIMA: pelo menos X% abaixo do preço cheio do produto -> avisa NA HORA.
  # (Para fixar uma referência em um tênis, ponha `preco_referencia: 1799.99`
  # naquele item do alvos.yaml.)
  desconto_otimo_pct: 35
  # Um par que estava mais barato mas SEM o seu número voltou a ter o número,
  # com pelo menos X% de desconto -> avisa NA HORA.
  desconto_volta_pct: 20
  # Novo menor preço do histórico (sem ser ótimo) -> entra no resumo do dia.
  bater_minimo_historico: true
  # Quantas leituras um alvo precisa ter antes de valer a regra do histórico
  # (evita "recorde" falso logo no começo, quando o histórico ainda está vazio).
  leituras_minimas_historico: 6

# Resumo diário: sai na primeira verificação a partir desta hora (horário de Brasília).
# As verificações rodam por volta de 8h, 14h e 20h.
resumo_diario:
  hora: 19

# Palavras que eliminam um produto (comparadas sem acento e em minúsculas).
excluir_sempre:
  - rm          # Air Jordan 4 RM não é o Retro
  - infantil
  - juvenil
  - baby
  - bebe
  - gs
  - td
  - ps
  - chinelo
  - slide
  - camiseta
  - meia
  - bone

# Palavras ignoradas ao comparar o nome do alvo com o nome do produto
# (as lojas nem sempre escrevem "Retro" ou "Tênis" no nome).
palavras_opcionais: [tenis, retro, og, masculino, unissex]

lojas:
  # ---- Lojas lidas direto (estoque do seu tamanho é verificado) ----
  artwalk:
    nome: Artwalk
    tipo: vtex
    ativa: true
    dominio: www.artwalk.com.br
    cupons_promobit: artwalk
  authentic-feet:
    nome: Authentic Feet
    tipo: vtex
    ativa: true
    dominio: www.authenticfeet.com.br
    cupons_promobit: authentic-feet
  magic-feet:
    nome: Magic Feet
    tipo: vtex
    ativa: true
    dominio: www.magicfeet.com.br
    cupons_promobit: null
  ostore:
    nome: Ostore
    tipo: vtex
    ativa: true
    dominio: www.ostore.com.br
    cupons_promobit: null
  new-balance:
    nome: New Balance
    tipo: vtex
    ativa: true
    dominio: www.newbalance.com.br
    cupons_promobit: new-balance
  fila:
    nome: Fila
    tipo: vtex
    ativa: true
    dominio: www.fila.com.br
    cupons_promobit: fila
  mizuno:
    nome: Mizuno
    tipo: vtex
    ativa: true
    dominio: www.mizuno.com.br
    cupons_promobit: mizuno
  olympikus:
    nome: Olympikus
    tipo: vtex
    ativa: true
    dominio: www.olympikus.com.br
    cupons_promobit: olympikus

  # ---- Promobit: promoções ativas de lojas que bloqueiam o GitHub ----
  # (Nike, Centauro, Netshoes...). Estoque do tamanho NÃO é verificado.
  # Só entram ofertas vendidas por estas lojas (marketplaces como Amazon,
  # Mercado Livre e Shopee ficam de fora por causa de vendedores terceiros).
  promobit:
    nome: Promobit
    tipo: promobit_busca
    ativa: true
    dias: 3          # ignora promoções publicadas há mais de 3 dias
    lojas_permitidas:
      - Nike
      - Centauro
      - Netshoes
      - Zattini
      - Dafiti
      - Adidas
      - Puma
      - Vans
      - New Balance
      - Fila
      - Asics
      - Mizuno
      - Olympikus
      - Artwalk
      - Authentic Feet
      - Magic Feet
      - Ostore
      - Maze
      - Gdlp
      - Converse
      - Reebok
      - Under Armour

# Quantos cupons recentes (no máximo) mandar junto com o alerta, e até quantos dias de idade.
cupons:
  maximo: 3
  dias: 21
