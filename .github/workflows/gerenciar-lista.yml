name: Gerenciar lista de tênis

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [adicionar, remover, listar]
        default: adicionar
      nome:
        description: "Nome do tênis (ex.: Air Jordan 5 Retro)"
        type: string
        required: false
      busca:
        description: "Termo de busca nas lojas (opcional; padrão = nome)"
        type: string
        required: false
      excluir:
        description: "Palavras para ignorar, separadas por vírgula (opcional; ex.: low,se)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: caca-tenis
  cancel-in-progress: false

jobs:
  gerenciar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Atualizar lista
        env:
          ACAO: ${{ inputs.acao }}
          NOME: ${{ inputs.nome }}
          BUSCA: ${{ inputs.busca }}
          EXCLUIR: ${{ inputs.excluir }}
        run: |
          case "$ACAO" in
            listar)    python gerenciar.py listar ;;
            remover)   python gerenciar.py remover "$NOME" ;;
            adicionar)
              args=(adicionar "$NOME")
              [ -n "$BUSCA" ] && args+=(--busca "$BUSCA")
              [ -n "$EXCLUIR" ] && args+=(--excluir "$EXCLUIR")
              python gerenciar.py "${args[@]}" ;;
          esac
          echo '### Lista atual' >> "$GITHUB_STEP_SUMMARY"
          python gerenciar.py listar | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Mandar resumo com a lista nova
        if: inputs.acao != 'listar'
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --resumo

      - name: Salvar no repositório
        if: inputs.acao != 'listar'
        run: |
          git config user.name "caca-tenis-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alvos.yaml dados/
          git diff --cached --quiet && exit 0
          git commit -m "lista: $ACAO $NOME"
          git pull --rebase --autostash
          git push
        env:
          ACAO: ${{ inputs.acao }}
          NOME: ${{ inputs.nome }}
