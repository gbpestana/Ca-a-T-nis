name: Comandos do Telegram

# Com o repassador da Cloudflare ligado, cada comando chega aqui na hora
# (repository_dispatch). O agendamento é só uma reserva, caso o repassador
# esteja desligado: confere se há mensagens novas e termina em segundos.
on:
  repository_dispatch:
    types: [telegram]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caca-tenis
  cancel-in-progress: false

jobs:
  comandos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Tem mensagem nova?
        id: checar
        run: |
          OFF=$(jq -r '.offset // 0' dados/telegram.json 2>/dev/null || echo 0)
          N=$(curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?offset=${OFF}&timeout=0" | jq '.result | length' 2>/dev/null || echo 0)
          echo "mensagens novas: $N"
          if [ "${N:-0}" -gt 0 ] || [ ! -f dados/telegram.json ] || [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.checar.outputs.tem == 'sim'
        with:
          python-version: "3.12"
          cache: pip

      - name: Responder comandos
        if: steps.checar.outputs.tem == 'sim'
        env:
          P_MENSAGEM: ${{ github.event.client_payload.mensagem }}
          P_RESPOSTA_A: ${{ github.event.client_payload.resposta_a }}
        run: |
          pip install -q -r requirements.txt
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            MENSAGEM="$P_MENSAGEM" RESPOSTA_A="$P_RESPOSTA_A" python bot.py
          else
            python bot.py
          fi

      - name: Salvar no repositório
        if: steps.checar.outputs.tem == 'sim'
        run: |
          git config user.name "caca-tenis-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alvos.yaml dados/
          git diff --cached --quiet && exit 0
          git commit -m "telegram: comandos"
          git pull --rebase --autostash
          git push
