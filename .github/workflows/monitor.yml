name: Monitor de preços

on:
  schedule:
    - cron: "23 */3 * * *"   # a cada 3 horas (horário UTC)
  workflow_dispatch:
    inputs:
      resumo:
        description: "Mandar resumo com o melhor preço atual de cada tênis"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: caca-tenis
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESUMO: ${{ inputs.resumo }}
        run: |
          if [ "$RESUMO" = "true" ]; then python monitor.py --resumo; else python monitor.py; fi

      - name: Salvar histórico no repositório
        if: always()
        run: |
          git config user.name "caca-tenis-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet && exit 0
          git commit -m "histórico $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
