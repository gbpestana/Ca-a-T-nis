name: Diagnóstico de lojas

# Testa quais lojas respondem a partir dos servidores do GitHub.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Opcional: 'vtex dominio1 dominio2' ou 'promobit slug1 slug2'"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: caca-tenis
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Testar lojas
        env:
          ARGS: ${{ inputs.args }}
        run: python diagnostico.py $ARGS
      - name: Salvar resultado
        run: |
          git config user.name "caca-tenis-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/diagnostico.json
          git diff --cached --quiet && exit 0
          git commit -m "diagnóstico de lojas"
          git pull --rebase --autostash
          git push
